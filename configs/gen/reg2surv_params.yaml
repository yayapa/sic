model_distribution:
  eh: 1.0

inv_hazard_distribution:
  weibull: 0.2
  lognormal: 0.2
  loglogistic: 0.2
  gompertz: 0.2
  birnbaum-saunders: 0.2

censoring_rate:
  min: 0.1
  max: 0.9

q_star:
  min: 0.01
  max: 0.99
t_star:
  min: 0.01
  max: 100.0

bounds:
  weibull:
    k:
      min: 0.5
      max: 5.0
  gompertz:
    b:
      min: 0.0
      max: 0.3
  lognormal:
    sigma:
      min: 0.3
      max: 1.5
  loglogistic:
    a:
      min: 0.5
      max: 5.0
  birnbaum-saunders:
    alpha:
      min: 0.5
      max: 5.0

dtype: float32